services:
  - type: web
    name: grupo-24-oo2
    runtime: docker
    plan: free
    healthCheckPath: /login
    envVars:
      - key: DB_URL
        fromDatabase:
          name: grupo-24-oo2-db
          property: connectionString
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_MAIL
        value: admin@system.com
      - key: ADMIN_DNI
        value: 99999999

databases:
  - name: grupo-24-oo2-db
    plan: free
    databaseName: grupo24
    user: grupo24
